<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1>Student Management System</h1>

<!-- Tab Buttons -->
<div class="tabs">
    <button onclick="showTab('students')">Students</button>
    <button onclick="showTab('courses')">Courses</button>
</div>

<!-- STUDENTS SECTION -->
<div id="students" class="tab-content">
    <h2>Add Student</h2>
    <form id="studentForm">
        <input type="text" id="firstName" placeholder="First Name" required>
        <input type="text" id="lastName" placeholder="Last Name" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="text" id="phoneNumber" placeholder="Phone Number">
        <input type="date" id="dateOfBirth">
        <input type="text" id="address" placeholder="Address">
        <input type="date" id="enrollmentDate" required>
        <button type="submit">Add Student</button>
    </form>

    <h2>Student List</h2>
    <table id="studentTable">
        <thead>
        <tr>
            <th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Actions</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<!-- COURSES SECTION -->
<div id="courses" class="tab-content" style="display:none;">
    <h2>Add Course</h2>
    <form id="courseForm">
        <input type="text" id="courseCode" placeholder="Course Code" required>
        <input type="text" id="courseName" placeholder="Course Name" required>
        <input type="text" id="description" placeholder="Description">
        <input type="number" id="credits" placeholder="Credits" min="1" max="10" required>
        <input type="text" id="instructor" placeholder="Instructor">
        <button type="submit">Add Course</button>
    </form>

    <h2>Course List</h2>
    <table id="courseTable">
        <thead>
        <tr>
            <th>ID</th><th>Code</th><th>Name</th><th>Credits</th><th>Actions</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script src="js/app.js"></script>
</body>
</html>
